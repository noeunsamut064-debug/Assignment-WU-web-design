<!DOCTYPE html>
<html>
      <head>
            <title>Register Page</title>
            <link rel="stylesheet" href="./create_acc.css" />
      </head>
      <body>
            <div class="box-wrap">
                  <form action="">
                        <h1>Register</h1>
                        <br />
                        <hr />
                        <br />
                                    <div class="input-box">
                              <label for="Email">Email:</label>
                              <br />
                              <input 
                              type="email" 
                              id="Email"
                              placeholder="e.g. Johnson@gmail.com" required/>
                        </div>
                        <div class="input-box">
                              <label for="First name">First name:</label>
                              <input
                                    type="text"
                                    placeholder="First name"
                                    autofocus
                                    required />
                        </div>
                        <div class="input-box">
                              <label for="Last name">Last name:</label>
                              <input
                                    type="text"
                                    placeholder="Last name"
                                    autofocus
                                    required />
                        </div>
                        <div class="input-box">
                              <label for="phone number">Phone Number:</label>
                              <input
                                    type="tel"
                                    placeholder="Phone Number"
                                    autofocus
                                    requied />
                        </div>
                        <div class="input-box">
                              <label for="password">Password:</label>
                              <input
                                    type="password"
                                    placeholder="Password"
                                    autofocus
                                    requied />
                        </div>
                        <div class="input-box">
                              <label for="confirm password">
                                    Confirm Password:
                              </label>
                              <input
                                    type="password"
                                    placeholder="Confirm Password"
                                    autofocus
                                    requied />
                        </div>
                        <br />
                        <button class="button">Sign Up</button>
                        <div class="signin">
                              <p class="ahaa">Already have an account?</p>
                              <p><a href="#" class="sgi">Sign in</a></p>
                        </div>
                  </form>
            </div>
      </body>
</html>
